<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#060f1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Прогноз клёва">
<meta name="description" content="Гибридный солунарно-погодный прогноз клёва рыбы">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2300d4aa'/%3E%3Ctext x='50' y='68' font-size='60' text-anchor='middle'%3E🎣%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
<title>Прогноз клёва</title>
</head>
<body>
<div class="ambient"></div>
<div class="app">
  <header class="header">
    <div class="logo">
      <div class="logo-icon">🎣</div>
      <span>Прогноз клёва</span>
    </div>
  </header>

  <div class="search-box">
    <div class="search-input-wrap">
      <input type="text" class="search-input" id="cityInput" placeholder="Введите город..." autocomplete="off">
      <button class="search-btn" id="searchBtn" title="Найти" aria-label="Найти">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      </button>
      <button class="geo-btn" id="geoBtn" title="Моё местоположение" aria-label="Моё местоположение">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
      </button>
    </div>
    <div class="autocomplete" id="autocomplete"></div>
  </div>

  <div class="location-chip" id="locationChip" style="display:none"></div>

  <main id="content" style="display:none">
    <section class="hero animate-in">
      <div class="hero-label">Индекс клёва сейчас</div>
      <div class="bite-ring">
        <svg width="200" height="200" viewBox="0 0 200 200">
          <defs>
            <linearGradient id="biteGradient" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#00d4aa"/>
              <stop offset="100%" stop-color="#4facfe"/>
            </linearGradient>
          </defs>
          <circle class="bite-ring-bg" cx="100" cy="100" r="90"/>
          <circle class="bite-ring-fill" id="biteRingFill" cx="100" cy="100" r="90"/>
        </svg>
        <div class="bite-value">
          <div class="bite-percent" id="bitePercent">--</div>
          <div class="bite-category" id="biteCategory">--</div>
        </div>
      </div>
    </section>

    <section class="weather-strip animate-in delay-1" id="weatherStrip"></section>

    <section class="section-title animate-in delay-1">Лучшие слоты</section>
    <section class="slots animate-in delay-2" id="slots"></section>

    <section class="section-title animate-in delay-2">Прогноз по часам</section>
    <div class="chart-wrap animate-in delay-3">
      <canvas class="chart-canvas" id="hourChart"></canvas>
    </div>

    <section class="section-title animate-in delay-3">Прогноз по дням</section>
    <nav class="day-picker animate-in delay-3" id="dayPicker"></nav>
    <section class="hourly-list" id="hourlyList"></section>
  </main>
</div>

<div class="loading-overlay" id="loading">
  <div class="spinner"></div>
  <div class="loading-text" id="loadingText">Загрузка прогноза...</div>
</div>

<div class="toast" id="toast"></div>

<script src="js/app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(console.error);
}
</script>
</body>
</html>
