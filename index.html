<title>Прогноз клёва</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:#060f1a;color:#f0f4f8;overflow-x:hidden;line-height:1.5;-webkit-font-smoothing:antialiased}
.ambient{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 80% 50% at 20% 40%,rgba(0,212,170,0.08) 0%,transparent 60%),radial-gradient(ellipse 60% 40% at 80% 60%,rgba(79,172,254,0.06) 0%,transparent 60%),linear-gradient(180deg,#060f1a 0%,#0a1929 50%,#060f1a 100%)}
.app{position:relative;z-index:1;max-width:480px;margin:0 auto;min-height:100vh;padding:0 16px 40px}
.header{display:flex;align-items:center;justify-content:space-between;padding:16px 0 8px}
.logo{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700;background:linear-gradient(135deg,#00d4aa,#4facfe);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.logo-icon{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#00d4aa,#4facfe);display:flex;align-items:center;justify-content:center;font-size:18px;-webkit-text-fill-color:#fff;color:#fff}
.search-box{position:relative;margin-bottom:16px}
.search-input-wrap{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:20px;padding:4px 4px 4px 16px;backdrop-filter:blur(20px);transition:all .3s}
.search-input-wrap:focus-within{border-color:#00d4aa;box-shadow:0 0 0 3px rgba(0,212,170,0.15)}
.search-input{flex:1;background:none;border:none;color:#f0f4f8;font-size:16px;padding:12px 0;outline:none}
.search-input::placeholder{color:#8a9bb0}
.search-btn,.geo-btn{width:44px;height:44px;border-radius:12px;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s}
.search-btn{background:#00d4aa;color:#000}
.search-btn:hover{transform:scale(1.05)}
.geo-btn{background:rgba(255,255,255,0.07);color:#8a9bb0;border:1px solid rgba(255,255,255,0.08)}
.geo-btn:hover{color:#00d4aa;border-color:#00d4aa}
.autocomplete{position:absolute;top:calc(100% + 8px);left:0;right:0;background:rgba(10,25,41,0.95);border:1px solid rgba(255,255,255,0.08);border-radius:12px;backdrop-filter:blur(20px);max-height:280px;overflow-y:auto;opacity:0;transform:translateY(-8px);pointer-events:none;transition:all .25s ease;z-index:100}
.autocomplete.open{opacity:1;transform:translateY(0);pointer-events:auto}
.autocomplete-item{padding:14px 16px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,0.08);display:flex;flex-direction:column;gap:2px;transition:background .15s}
.autocomplete-item:last-child{border-bottom:none}
.autocomplete-item:hover{background:rgba(255,255,255,0.07)}
.autocomplete-item .name{font-size:15px;font-weight:500}
.autocomplete-item .meta{font-size:12px;color:#8a9bb0}
.location-chip{display:inline-flex;align-items:center;gap:6px;background:rgba(0,212,170,0.15);color:#00d4aa;padding:6px 14px;border-radius:20px;font-size:13px;font-weight:500;margin-bottom:20px;border:1px solid rgba(0,212,170,0.2)}
.hero{text-align:center;padding:24px 0 32px}
.hero-label{font-size:13px;text-transform:uppercase;letter-spacing:1.5px;color:#8a9bb0;margin-bottom:16px}
.bite-ring{position:relative;width:200px;height:200px;margin:0 auto 20px}
.bite-ring svg{transform:rotate(-90deg)}
.bite-ring-bg{fill:none;stroke:rgba(255,255,255,0.06);stroke-width:10}
.bite-ring-fill{fill:none;stroke:url(#biteGradient);stroke-width:10;stroke-linecap:round;stroke-dasharray:565;stroke-dashoffset:565;transition:stroke-dashoffset 1.5s cubic-bezier(0.22,1,0.36,1)}

.hour-row{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:10px 14px;backdrop-filter:blur(10px)}
.hour-time{width:44px;font-size:13px;font-weight:500;color:#8a9bb0;flex-shrink:0}
.hour-bar-wrap{flex:1;height:8px;background:rgba(255,255,255,0.06);border-radius:4px;overflow:hidden}
.hour-bar{height:100%;border-radius:4px;transition:width .6s ease}

.loading-overlay{position:fixed;inset:0;background:rgba(6,15,26,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1000;opacity:0;pointer-events:none;transition:opacity .3s}
.loading-overlay.active{opacity:1;pointer-events:auto}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:rgba(255,107,107,.95);color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;font-weight:500;z-index:1001;opacity:0;transition:all .3s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.noscript-msg{text-align:center;padding:40px 20px;color:#8a9bb0}
.noscript-msg h2{color:#f0f4f8;margin-bottom:8px}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.animate-in{animation:fadeUp .5s ease forwards}
.delay-1{animation-delay:.1s;opacity:0}
.delay-2{animation-delay:.2s;opacity:0}
.delay-3{animation-delay:.3s;opacity:0}
@media(max-width:360px){.app{padding:0 12px 30px}.bite-ring{width:170px;height:170px}.bite-percent{font-size:44px}}
</style>

<body>
<div class="ambient"></div>
<div class="app">
  <header class="header">
    <div class="logo"><div class="logo-icon">🎣</div><span>Прогноз клёва</span></div>
  </header>
  <div class="search-box">

      <input type="text" class="search-input" id="cityInput" placeholder="Введите город..." autocomplete="off">
      <button class="search-btn" id="searchBtn" title="Найти" aria-label="Найти">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>

  <main id="content" style="display:none">

        <svg width="200" height="200" viewBox="0 0 200 200">
          <defs><linearGradient id="biteGradient" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#00d4aa"/><stop offset="100%" stop-color="#4facfe"/></linearGradient></defs>
          <circle class="bite-ring-bg" cx="100" cy="100" r="90"/>
          <circle class="bite-ring-fill" id="biteRingFill" cx="100" cy="100" r="90"/>
        </svg>
        <div class="bite-value"><div class="bite-percent" id="bitePercent">--</div><div class="bite-category" id="biteCategory">--</div></div>
      </div>
    </section>
    <section class="weather-strip animate-in delay-1" id="weatherStrip"></section>
    <section class="section-title animate-in delay-1">Лучшие слоты</section>
    <section class="slots animate-in delay-2" id="slots"></section>
    <section class="section-title animate-in delay-2">Прогноз по часам</section>

    <section class="section-title animate-in delay-3">Прогноз по дням</section>

  </main>
</div>
<div class="loading-overlay" id="loading"><div class="spinner"></div><div class="loading-text" id="loadingText">Загрузка прогноза...</div></div>
<div class="toast" id="toast"></div>
<script>
/**
 * Fishing Forecast PWA — inline build
 * Hybrid solunar-weather model per methodology v2
 */

let currentLat=55.7558,currentLon=37.6173,currentCity='Москва',weatherData=null,selectedDay=0,debounceTimer=null;
const $=id=>document.getElementById(id);

/* ---------- ASTRONOMY ---------- */
function toJulian(d){return d.getTime()/864e5-.5+2440587.5}
function sunPosition(jd){
  const n=jd-2451545,L=(280.460+.9856474*n)%360,g=((357.528+.9856003*n)%360)*Math.PI/180;
  const lambda=(L+1.915*Math.sin(g)+.02*Math.sin(2*g))*Math.PI/180;
  const epsilon=(23.439-4e-7*n)*Math.PI/180;
  return{ra:Math.atan2(Math.cos(epsilon)*Math.sin(lambda),Math.cos(lambda)),dec:Math.asin(Math.sin(epsilon)*Math.sin(lambda))};
}
function moonPosition(jd){
  const T=(jd-2451545)/36525,Lp=(218.316+481267.881*T)%360,M=((134.963+477198.867*T)%360)*Math.PI/180,D=((297.850+445267.112*T)%360)*Math.PI/180,F=((93.272+483202.018*T)%360)*Math.PI/180;
  const lon=(Lp+6.289*Math.sin(M)+1.274*Math.sin(2*D-M)+.658*Math.sin(2*D)+.214*Math.sin(2*M)-.186*Math.sin(D)-.114*Math.sin(2*F))*Math.PI/180;
  const lat=(5.128*Math.sin(F)+.281*Math.sin(M+F)+.278*Math.sin(M-F)+.173*Math.sin(2*D-F))*Math.PI/180;
  const ra=Math.atan2(Math.sin(lon)*Math.cos(23.4397*Math.PI/180)-Math.tan(lat)*Math.sin(23.4397*Math.PI/180),Math.cos(lon));
  const dec=Math.asin(Math.sin(lat)*Math.cos(23.4397*Math.PI/180)+Math.cos(lat)*Math.sin(23.4397*Math.PI/180)*Math.sin(lon));
  return{ra,dec,lon:lon*180/Math.PI};
}
function hourAngle(jd,lon,ra){
  const gmst=(18.697374558+24.06570982441908*(jd-2451545))%24;
  const lst=gmst+lon/15;
  return((lst*15*Math.PI/180-ra)+Math.PI)%(2*Math.PI)-Math.PI;
}
function riseSetTransit(jd,lat,lon,dec,ra,h0){
  const H0=Math.acos(Math.max(-1,Math.min(1,(Math.sin(h0)-Math.sin(lat)*Math.sin(dec))/(Math.cos(lat)*Math.cos(dec)))));
  const transit=(ra-hourAngle(jd,lon,0)+lon)/(2*Math.PI)*24;
  return{rise:transit-H0/(2*Math.PI)*24,transit,set:transit+H0/(2*Math.PI)*24};
}
function getMoonTimes(date,lat,lon){
  const jd0=Math.floor(toJulian(date))-.5,times=[];
  for(let d=-1;d<=1;d++){
    const jd=jd0+d,mp=moonPosition(jd),h0=-.00989;
    const r=riseSetTransit(jd,lat*Math.PI/180,lon*Math.PI/180,mp.dec,mp.ra,h0);
    ['rise','transit','set'].forEach(k=>{const t=r[k]+d*24;if(t>=0&&t<=24)times.push({type:k==='transit'?'upper':k,time:t,jd:jd+t/24})});
  }
  times.sort((a,b)=>a.time-b.time);
  const res={rise:null,set:null,upper:null,lower:null};
  for(const t of times){
    if(t.type==='rise'&&!res.rise)res.rise=t;
    if(t.type==='set'&&!res.set)res.set=t;
    if(t.type==='upper'&&!res.upper)res.upper=t;
    if(t.type==='upper'&&res.upper&&!res.lower)res.lower={time:t.time+12.42,jd:t.jd+12.42/24};
  }
  if(res.upper&&!res.lower)res.lower={time:res.upper.time+12.42,jd:res.upper.jd+12.42/24};
  return res;
}
function getSunTimes(date,lat,lon){
  const jd=toJulian(date),sp=sunPosition(jd),h0=-.01454;
  const r=riseSetTransit(jd,lat*Math.PI/180,lon*Math.PI/180,sp.dec,sp.ra,h0);
  const jd0=Math.floor(jd)-.5;
  return{rise:{time:r.rise,jd:jd0+r.rise/24},set:{time:r.set,jd:jd0+r.set/24}};
}
function getMoonPhase(jd){
  const T=(jd-2451545)/36525,D=((297.850+445267.112*T)%360)*Math.PI/180,M=((134.963+477198.867*T)%360)*Math.PI/180,Mp=((218.316+481267.881*T)%360)*Math.PI/180;
  const elong=180-D*180/Math.PI-6.289*Math.sin(Mp)+2.1*Math.sin(M)+1.274*Math.sin(2*D-Mp)+.658*Math.sin(2*D);
  return(1-Math.cos(elong*Math.PI/180))/2;
}

/* ---------- SOLUNAR MODEL ---------- */
function computeSolunar(date,lat,lon){
  const moon=getMoonTimes(date,lat,lon),sun=getSunTimes(date,lat,lon);
  const jd=toJulian(date),phase=getMoonPhase(jd);
  // FIX: max at new/full moon (phase 0 or 1), min at quarters (0.5)
  const kPhase=1.2-.4*Math.abs(Math.sin(phase*Math.PI));

  const periods=[];
  if(moon.upper)periods.push({start:moon.upper.time-1,end:moon.upper.time+1,amp:40,type:'big'});
  if(moon.lower)periods.push({start:moon.lower.time-1,end:moon.lower.time+1,amp:40,type:'big'});
  if(moon.rise)periods.push({start:moon.rise.time-.5,end:moon.rise.time+.5,amp:25,type:'small'});
  if(moon.set)periods.push({start:moon.set.time-.5,end:moon.set.time+.5,amp:25,type:'small'});

  const overlapWindow=1.0;
  for(const p of periods){
    const center=p.start+(p.end-p.start)/2;
    const nearSunrise=Math.abs(center-sun.rise.time)<=overlapWindow;
    const nearSunset=Math.abs(center-sun.set.time)<=overlapWindow;
    // FIX: (1 + Bonus_overlap) => multiplier = 2.0 when overlapping
    p.super=(nearSunrise||nearSunset)?2.0:1.0;
  }

  const hourly=[];
  for(let h=0;h<24;h++){
    let score=15;
    for(const p of periods){
      if(h>=p.start&&h<=p.end){
        const center=(p.start+p.end)/2;
        const dist=Math.abs(h+.5-center);
        const peak=p.amp*Math.max(0,1-dist/((p.end-p.start)/2));
        score+=peak*kPhase*p.super;
      }
    }
    hourly.push(Math.min(100,Math.max(0,score)));
  }
  return{hourly,moon,sun,phase,kPhase,periods};
}

/* ---------- WEATHER ---------- */
async function fetchWithTimeout(url,ms=10000){
  const c=new AbortController();
  const t=setTimeout(()=>c.abort(),ms);
  try{const r=await fetch(url,{signal:c.signal});clearTimeout(t);return r}catch(e){clearTimeout(t);throw e}
}
async function fetchWeather(lat,lon){
  const url='https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+'&hourly=temperature_2m,pressure_msl,cloud_cover,precipitation,weather_code,wind_speed_10m&daily=sunrise,sunset&timezone=auto&forecast_days=5';
  const r=await fetchWithTimeout(url);
  if(!r.ok)throw new Error('Weather API: '+r.status);
  return r.json();
}
function getSeasonCoeff(){
  const m=new Date().getMonth();
  if(m>=2&&m<=4)return 1.15;
  if(m>=5&&m<=7)return.85;
  if(m>=8&&m<=9)return 1.15;
  return.7;
}
function getWeatherMod(hourIdx,data,dayOffset,solunar){
  const p=data.hourly.pressure_msl,t=data.hourly.temperature_2m,w=data.hourly.wind_speed_10m,c=data.hourly.cloud_cover,pr=data.hourly.precipitation,wc=data.hourly.weather_code;
  const base=dayOffset*24;
  const i=Math.min(base+hourIdx,p.length-1);
  const i3=Math.max(0,i-3);

  let mod=1.0;

  // FIX: convert hPa delta to mmHg (1 mmHg = 1.333 hPa)
  const dp=(p[i]-p[i3])/1.33322;
  if(dp>=-1&&dp<=1)mod*=1.05;
  else if(dp>=-3&&dp<-1)mod*=1.10;
  else if(dp<-3)mod*=1.18;
  else if(dp>1&&dp<=3)mod*=.95;
  else if(dp>3)mod*=.80;

  if(w[i]>=10)mod*=.80;
  else if(w[i]<=5)mod*=1.05;

  const code=wc[i];
  if(code>=95)mod*=.65;
  else if(pr[i]>0&&pr[i]<2.5)mod*=1.08;

  const h=hourIdx,sr=solunar.sun.rise.time,ss=solunar.sun.set.time;
  if(h>=sr&&h<=ss){
    if(c[i]>80)mod*=1.10;
    else if(c[i]>30)mod*=1.05;
  }

  // FIX: temperature swing >5°C per 24h
  const i24=Math.max(0,i-24);
  if(Math.abs(t[i]-t[i24])>5)mod*=.85;

  // Clamp weather modifier per methodology [0.5, 1.3]
  return Math.max(.5,Math.min(1.3,mod));
}
function computeForecast(date,lat,lon,wdata){
  const sol=computeSolunar(date,lat,lon);
  const dayOffset=Math.floor((date-new Date(wdata.hourly.time[0]))/864e5);
  const kSeason=getSeasonCoeff();
  const hourly=sol.hourly.map((s,h)=>Math.min(100,s*getWeatherMod(h,wdata,dayOffset,sol)*kSeason));

  const now=new Date(),currentHour=now.getHours();
  const currentScore=hourly[currentHour]||hourly[0];

  const slots=[];
  for(let h=0;h<24;h++)slots.push({hour:h,score:hourly[h]});
  slots.sort((a,b)=>b.score-a.score);

  const topSlots=slots.slice(0,3).map((s,i)=>{const e=(s.hour+3)%24;return{rank:i+1,start:s.hour,end:e,score:Math.round(s.score),peakHour:s.hour}});
  return{solunar:sol,hourly,currentScore,topSlots,date};
}

/* ---------- UI ---------- */
function showToast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000)}
function setLoading(txt,on){$('loadingText').textContent=txt;if(on)$('loading').classList.add('active');else $('loading').classList.remove('active')}
function category(s){if(s>=75)return{label:'Отличный',cls:'cat-excellent'};if(s>=50)return{label:'Хороший',cls:'cat-good'};if(s>=25)return{label:'Средний',cls:'cat-average'};return{label:'Слабый',cls:'cat-poor'}}
function formatTime(h){return String(h).padStart(2,'0')+':00'}
function formatRange(s,e){return formatTime(s)+' – '+formatTime(e)}

function renderMain(forecast){
  const score=Math.round(forecast.currentScore),cat=category(score);
  $('bitePercent').textContent=score+'%';
  $('biteCategory').textContent=cat.label;
  $('biteCategory').className='bite-category '+cat.cls;
  const circ=2*Math.PI*90,off=circ-(score/100)*circ;
  setTimeout(()=>{$('biteRingFill').style.strokeDashoffset=off},100);

  const w=weatherData,base=selectedDay*24,wi=Math.min(base+new Date().getHours(),w.hourly.pressure_msl.length-1);
  $('weatherStrip').innerHTML='<div class="weather-item"><div class="label">Давление</div><div class="value">'+Math.round(w.hourly.pressure_msl[wi])+' гПа</div></div><div class="weather-item"><div class="label">Температура</div><div class="value">'+Math.round(w.hourly.temperature_2m[wi])+'°C</div></div><div class="weather-item"><div class="label">Ветер</div><div class="value">'+Math.round(w.hourly.wind_speed_10m[wi])+' м/с</div></div><div class="weather-item"><div class="label">Облачность</div><div class="value">'+w.hourly.cloud_cover[wi]+'%</div></div>';

  $('slots').innerHTML=forecast.topSlots.map(s=>{
    const c=category(s.score),col=s.score>=75?'#00d4aa':s.score>=50?'#4facfe':s.score>=25?'#ffd166':'#ff6b6b';
    return'<div class="slot-card"><div class="slot-rank rank-'+s.rank+'">'+s.rank+'</div><div class="slot-info"><div class="slot-time">'+formatRange(s.start,s.end)+'</div><div class="slot-detail">Пик в '+formatTime(s.peakHour)+'</div></div><div class="slot-score"><div class="slot-score-val" style="color:'+col+'">'+s.score+'%</div><div class="slot-score-label">'+c.label+'</div></div></div>';
  }).join('');

  drawChart(forecast.hourly);
  renderDayPicker();
  renderHourlyList(forecast.hourly);
  $('content').style.display='block';
}

function drawChart(hourly){
  const canvas=$('hourChart'),dpr=window.devicePixelRatio||1,rect=canvas.getBoundingClientRect();
  if(!rect.width)return;
  canvas.width=rect.width*dpr;canvas.height=rect.height*dpr;
  const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);
  const w=rect.width,h=rect.height,pad={top:20,right:10,bottom:30,left:10},cw=w-pad.left-pad.right,ch=h-pad.top-pad.bottom;
  ctx.clearRect(0,0,w,h);
  const grad=ctx.createLinearGradient(0,pad.top,0,h-pad.bottom);
  grad.addColorStop(0,'rgba(0,212,170,0.25)');grad.addColorStop(1,'rgba(0,212,170,0.0)');
  ctx.beginPath();ctx.moveTo(pad.left,h-pad.bottom);
  for(let i=0;i<24;i++){const x=pad.left+(i/23)*cw,y=pad.top+(1-hourly[i]/100)*ch;if(i===0)ctx.lineTo(x,y);else{const px=pad.left+((i-1)/23)*cw,py=pad.top+(1-hourly[i-1]/100)*ch,cx=(px+x)/2;ctx.bezierCurveTo(cx,py,cx,y,x,y)}}
  ctx.lineTo(pad.left+cw,h-pad.bottom);ctx.closePath();ctx.fillStyle=grad;ctx.fill();
  ctx.beginPath();
  for(let i=0;i<24;i++){const x=pad.left+(i/23)*cw,y=pad.top+(1-hourly[i]/100)*ch;if(i===0)ctx.moveTo(x,y);else{const px=pad.left+((i-1)/23)*cw,py=pad.top+(1-hourly[i-1]/100)*ch,cx=(px+x)/2;ctx.bezierCurveTo(cx,py,cx,y,x,y)}}
  ctx.strokeStyle='#00d4aa';ctx.lineWidth=2.5;ctx.stroke();
  for(let i=0;i<24;i+=4){const x=pad.left+(i/23)*cw,y=pad.top+(1-hourly[i]/100)*ch;ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fillStyle='#0a1929';ctx.fill();ctx.strokeStyle='#00d4aa';ctx.lineWidth=2;ctx.stroke()}
  ctx.fillStyle='#8a9bb0';ctx.font='11px sans-serif';ctx.textAlign='center';
  for(let i=0;i<24;i+=4){const x=pad.left+(i/23)*cw;ctx.fillText(formatTime(i),x,h-8)}
}

function renderDayPicker(){
  const days=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'],today=new Date();let html='';
  for(let d=0;d<5;d++){const date=new Date(today);date.setDate(today.getDate()+d);const act=d===selectedDay?'active':'';html+='<button class="day-btn '+act+'" data-day="'+d+'"><div class="dow">'+days[date.getDay()]+'</div><div class="dom">'+date.getDate()+'</div></button>'}
  $('dayPicker').innerHTML=html;
  document.querySelectorAll('.day-btn').forEach(btn=>{btn.addEventListener('click',()=>{selectedDay=parseInt(btn.dataset.day);updateForecast()})});
}
function renderHourlyList(hourly){
  const now=new Date().getHours();
  $('hourlyList').innerHTML=hourly.map((score,h)=>{const isNow=h===now&&selectedDay===0,col=score>=75?'#00d4aa':score>=50?'#4facfe':score>=25?'#ffd166':'#ff6b6b';return'<div class="hour-row"><div class="hour-time">'+(isNow?'<b>Сейчас</b>':formatTime(h))+'</div><div class="hour-bar-wrap"><div class="hour-bar" style="width:'+score+'%;background:'+col+'"></div></div><div class="hour-score" style="color:'+col+'">'+Math.round(score)+'%</div></div>'}).join('');
}

/* ---------- GEOCODING ---------- */
async function searchCities(q){if(q.length<2)return[];const url='https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(q)+'&count=5&language=ru';const r=await fetchWithTimeout(url);const d=await r.json();return d.results||[]}
function showAutocomplete(results){
  const el=$('autocomplete');if(!results.length){el.classList.remove('open');return}
  el.innerHTML=results.map(r=>{const region=[r.admin1,r.country].filter(Boolean).join(', ');return'<div class="autocomplete-item" data-lat="'+r.latitude+'" data-lon="'+r.longitude+'" data-name="'+r.name+'"><div class="name">'+r.name+'</div><div class="meta">'+region+'</div></div>'}).join('');
  el.classList.add('open');
  el.querySelectorAll('.autocomplete-item').forEach(item=>{item.addEventListener('click',()=>{selectCity(item.dataset.name,parseFloat(item.dataset.lat),parseFloat(item.dataset.lon));el.classList.remove('open')})});
}
function selectCity(name,lat,lon){
  currentCity=name;currentLat=lat;currentLon=lon;$('cityInput').value=name;$('locationChip').style.display='inline-flex';$('locationChip').textContent=name;
  weatherData=null;selectedDay=0;updateForecast();
}
async function updateForecast(){
  setLoading('Расчёт прогноза...',true);
  try{
    if(!weatherData)weatherData=await fetchWeather(currentLat,currentLon);
    const date=new Date();date.setDate(date.getDate()+selectedDay);
    const forecast=computeForecast(date,currentLat,currentLon,weatherData);
    renderMain(forecast);
  }catch(e){console.error(e);showToast('Ошибка: '+(e.message||'Не удалось загрузить прогноз'))}
  finally{setLoading('',false)}
}

/* ---------- EVENTS ---------- */
$('cityInput').addEventListener('input',e=>{clearTimeout(debounceTimer);const val=e.target.value.trim();if(!val){$('autocomplete').classList.remove('open');return}debounceTimer=setTimeout(async()=>{try{const r=await searchCities(val);showAutocomplete(r)}catch(e){console.error(e)}},300)});
$('cityInput').addEventListener('keydown',e=>{if(e.key==='Enter'){$('autocomplete').classList.remove('open');const val=e.target.value.trim();if(val)searchCities(val).then(r=>{if(r[0])selectCity(r[0].name,r[0].latitude,r[0].longitude)})}});
$('searchBtn').addEventListener('click',()=>{const val=$('cityInput').value.trim();if(val)searchCities(val).then(r=>{if(r[0])selectCity(r[0].name,r[0].latitude,r[0].longitude)})});
$('geoBtn').addEventListener('click',()=>{if(!navigator.geolocation){showToast('Геолокация не поддерживается');return}setLoading('Определение местоположения...',true);navigator.geolocation.getCurrentPosition(async pos=>{currentLat=pos.coords.latitude;currentLon=pos.coords.longitude;try{const r=await fetchWithTimeout('https://geocoding-api.open-meteo.com/v1/search?name='+currentLat+','+currentLon+'&count=1');const d=await r.json();currentCity=(d.results&&d.results[0])?d.results[0].name:'Моё местоположение'}catch{currentCity='Моё местоположение'}$('cityInput').value=currentCity;weatherData=null;selectedDay=0;await updateForecast()},err=>{setLoading('',false);showToast('Не удалось получить геолокацию')})});
document.addEventListener('click',e=>{if(!e.target.closest('.search-box'))$('autocomplete').classList.remove('open')});
window.addEventListener('resize',()=>{if(weatherData){const date=new Date();date.setDate(date.getDate()+selectedDay);const f=computeForecast(date,currentLat,currentLon,weatherData);drawChart(f.hourly)}});

/* ---------- INIT ---------- */
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(console.error);
$('cityInput').value=currentCity;selectCity(currentCity,currentLat,currentLon);
</script>
